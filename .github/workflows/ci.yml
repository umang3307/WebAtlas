name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Install exactly the locked, hash-verified versions users get, then the package itself.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pip install pytest pytest-asyncio ruff
      - run: ruff check .
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # Fails the build if any locked dependency has a known vulnerability.
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
