name: Live crawl (real websites)

# Manual only: Actions tab -> "Live crawl (real websites)" -> Run workflow.
# Crawls a handful of public sites politely and uploads the JSON results as artifacts.
on:
  workflow_dispatch:

jobs:
  plain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: python scripts/live_crawl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-results-plain, path: live-results/ }

  with-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[render]" && playwright install --with-deps chromium
      - run: python scripts/live_crawl.py --render https://www.python.org/ https://react.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-results-render, path: live-results/ }
